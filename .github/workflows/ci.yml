name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Storybook Interaction Test(client の test スクリプト)は Playwright(chromium)を
      # 使って実行するため、CI環境にブラウザ本体を事前インストールしておく。
      - name: Install Playwright browsers
        run: yarn workspace @my-health-app/client playwright install --with-deps chromium

      # GraphQLスキーマの一次ソースはPothos(code-first)定義のみ(憲法 原則IV)。
      # クライアントのcodegen・typecheck・build・testはいずれも、サーバーが
      # 生成するschema.graphql(.gitignore対象)に依存するため、先に生成する。
      - name: Generate GraphQL schema (server)
        run: yarn workspace @my-health-app/server generate:schema

      - name: Generate GraphQL types (client)
        run: yarn workspace @my-health-app/client codegen

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Typecheck server
        run: yarn workspace @my-health-app/server typecheck

      - name: Typecheck client
        run: yarn workspace @my-health-app/client typecheck

      - name: Test server
        run: yarn workspace @my-health-app/server test

      # クライアントのテストは2つのプロジェクトに分かれている(apps/client/vite.config.ts)。
      # どちらが失敗したかがログ上で分かるよう、ステップも分けて実行する。
      # テーマ・コントラスト算出・APIの注入など、描画を伴わない単体テスト。
      - name: Test client (unit)
        run: yarn workspace @my-health-app/client vitest run --project unit

      # ストーリーをChromiumで実際に描画して操作するテスト。次の3つを兼ねている。
      # (1) Interaction Test: 4画面の取得・追加・削除・期間切替と画面遷移の検証。
      #     ブラウザでの目視確認の置き換え(specs/003-design-system-tokens research.md #5)。
      # (2) 見た目の検証: 書体・配色・余白などが実際の描画でトークンどおりかを
      #     計算済みスタイルで検証する(VRTを導入しない代わりの手段、同 #5)。
      # (3) アクセシビリティ検査: apps/client/.storybook/preview.tsx で a11y.test: "error"
      #     を設定しているため、axe の違反はこのステップの失敗になる
      #     (憲法 原則I: 「後で対応する」を認めない)。
      - name: Test client (Storybook interaction, appearance and a11y)
        run: yarn workspace @my-health-app/client vitest run --project storybook

      - name: Build client
        run: yarn workspace @my-health-app/client build

      # ストーリーの実行だけでは気づけない Storybook 自体の壊れ(アドオンの設定、
      # 静的ビルド固有の解決エラーなど)を検出する。Storybook が動かなくなると
      # 見た目とアクセシビリティの安全網そのものが失われるため、CI で確認する。
      - name: Build Storybook
        run: yarn workspace @my-health-app/client build-storybook
