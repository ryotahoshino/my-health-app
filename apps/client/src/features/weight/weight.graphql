query WeightRecords {
  weightRecords {
    id
    date
    weightKg
  }
}

query WeightTrendAggregate($period: AggregationPeriod!) {
  weightTrendAggregate(period: $period) {
    periodLabel
    startDate
    endDate
    hasData
    value
  }
}

mutation UpsertWeightRecord($input: UpsertWeightRecordInput!) {
  upsertWeightRecord(input: $input) {
    id
    date
    weightKg
  }
}

mutation DeleteWeightRecord($id: ID!) {
  deleteWeightRecord(id: $id)
}
